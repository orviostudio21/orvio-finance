{% if form.errors %}<div class="form-errors" role="alert"><strong>Revise os campos abaixo.</strong>{{ form.non_field_errors }}</div>{% endif %}{% for field in form %}<div class="field {% if field.errors %}invalid{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div id="{{ field.auto_id }}_error">{% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div>{% endif %}</div>{% endfor %}
