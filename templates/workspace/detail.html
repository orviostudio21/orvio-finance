{% extends 'base.html' %}{% block content %}<a class="back-link" href="{% url 'records' kind %}">← {{ config.label }}</a><div class="page-head"><div><p class="eyebrow">Detalhes do registro</p><h1>{{ object }}</h1></div><a class="button primary" href="{% url 'record-edit' kind object.pk %}">Editar registro</a></div><section class="panel form-panel"><dl class="details">{% for label,value in fields %}<div><dt>{{ label|capfirst }}</dt><dd>{{ value|linebreaksbr }}</dd></div>{% endfor %}</dl><div class="danger-zone"><a class="danger" href="{% url 'record-delete' kind object.pk %}">Excluir registro</a></div></section>{% endblock %}
